<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Passwordless Auth Workflow</title>
    <style>
        :root {
            --primary: #00f2ea;
            --secondary: #ff0050;
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
            --text-dim: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .auth-section {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .auth-section.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        input {
            padding: 0.8rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255,255,255,0.2);
            background-color: #2a2a2a;
            color: white;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            padding: 0.8rem;
            border-radius: 0.5rem;
            border: none;
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            margin-top: 1rem;
        }

        #recaptcha-container {
            margin-top: 1rem;
        }

        .status-msg {
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.2rem;
        }

        .success { color: #00ff88; }
        .error { color: #ff4444; }

        .toggle-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
        }

        .toggle-link span {
            color: var(--primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tashan Auth Workflow</h1>

        <!-- Section 1: Email Passwordless -->
        <div id="email-section" class="auth-section active">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>
            <button id="send-link-btn">Send Magic Link 📧</button>
            <div class="toggle-link" onclick="toggleAuth('phone')">Or use <span>Phone Number (SMS OTP)</span></div>
        </div>

        <!-- Section 2: Phone OTP -->
        <div id="phone-section" class="auth-section">
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+1234567890">
            </div>
            <div id="recaptcha-container"></div>
            <button id="send-otp-btn">Send SMS Code 📱</button>
            <div class="toggle-link" onclick="toggleAuth('email')">Or use <span>Email Magic Link</span></div>
        </div>

        <!-- Section 3: OTP Verification (Hidden by default) -->
        <div id="otp-verify-section" class="auth-section">
            <div class="input-group">
                <label for="otp">6-Digit SMS Code</label>
                <input type="text" id="otp" placeholder="123456" maxlength="6">
            </div>
            <button id="verify-otp-btn">Verify & Sign In 🚀</button>
            <div class="toggle-link" onclick="cancelOtp()">Cancel</div>
        </div>

        <div id="status" class="status-msg"></div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            sendSignInLinkToEmail, 
            isSignInWithEmailLink, 
            signInWithEmailLink,
            RecaptchaVerifier,
            signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // TODO: Replace with your project's Firebase config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const statusEl = document.getElementById('status');

        const showMsg = (msg, isError = false) => {
            statusEl.textContent = msg;
            statusEl.className = isError ? 'status-msg error' : 'status-msg success';
        };

        // --- 1. EMAIL LINK AUTHENTICATION ---

        document.getElementById('send-link-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            if (!email) return showMsg("Please enter an email", true);

            const actionCodeSettings = {
                url: window.location.href, // Link back to this page
                handleCodeInApp: true
            };

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                window.localStorage.setItem('emailForSignIn', email);
                showMsg("Magic link sent! Check your inbox.");
            } catch (error) {
                showMsg(error.message, true);
            }
        };

        // Handle return from email link
        if (isSignInWithEmailLink(auth, window.location.href)) {
            let email = window.localStorage.getItem('emailForSignIn');
            if (!email) {
                email = window.prompt('Please provide your email for confirmation');
            }

            signInWithEmailLink(auth, email, window.location.href)
                .then((result) => {
                    window.localStorage.removeItem('emailForSignIn');
                    showMsg("Successfully signed in with email! Welcome.");
                    // Clean up URL parameters
                    window.history.replaceState({}, document.title, window.location.pathname);
                })
                .catch((error) => {
                    showMsg(error.message, true);
                });
        }

        // --- 2. PHONE AUTHENTICATION (SMS OTP) ---

        let confirmationResult = null;

        // Setup Invisible reCAPTCHA
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'invisible',
            'callback': (response) => {
                // reCAPTCHA solved, allow signInWithPhoneNumber.
            }
        });

        document.getElementById('send-otp-btn').onclick = async () => {
            const phoneNumber = document.getElementById('phone').value;
            if (!phoneNumber) return showMsg("Please enter phone number", true);

            try {
                const appVerifier = window.recaptchaVerifier;
                confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, appVerifier);
                
                // Show OTP section
                document.getElementById('phone-section').classList.remove('active');
                document.getElementById('otp-verify-section').classList.add('active');
                showMsg("SMS Code sent successfully.");
            } catch (error) {
                showMsg(error.message, true);
            }
        };

        document.getElementById('verify-otp-btn').onclick = async () => {
            const code = document.getElementById('otp').value;
            if (!code) return showMsg("Please enter the 6-digit code", true);

            try {
                const result = await confirmationResult.confirm(code);
                showMsg("Phone verified! Sign-in successful.");
                document.getElementById('otp-verify-section').classList.remove('active');
                document.getElementById('email-section').classList.add('active');
            } catch (error) {
                showMsg("Wrong code or session expired. Try again.", true);
            }
        };

        // Helper functions
        window.toggleAuth = (type) => {
            document.querySelectorAll('.auth-section').forEach(s => s.classList.remove('active'));
            document.getElementById(type + '-section').classList.add('active');
            statusEl.textContent = '';
        };

        window.cancelOtp = () => {
            toggleAuth('phone');
        };

    </script>
</body>
</html>
