name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version"
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_VER, expected 17 or newer"
            exit 1
          fi
          echo "Java version $JAVA_VER verified successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found, generating temporary keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Target APK missing at $TARGET_APK"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is empty"
            exit 1
          fi
          echo "Verified regular non-empty APK exists at $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TMP_DIR=$(mktemp -d)
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr -c 'a-zA-Z0-9_-' '_')
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TMP_DIR}/${RELEASE_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset at $ASSET_PATH is missing or empty"
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${RELEASE_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset invalid prior to publishing"
            exit 1
          fi
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          gh release create "$TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          Run Number: ${{ github.run_number }}
          Run Attempt: ${{ github.run_attempt }}
          Commit SHA: ${{ github.sha }}

          Note: The APK is intended for testing and is not a Play Store production release."
